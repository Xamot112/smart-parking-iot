<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserve a bay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&display=swap">
<style>
:root{--bg:#f2f1ea;--ink:#1d2126;--mute:#656b73;--line:#1d2126;--blue:#1f5fbf;--card:#fff;--car:#9aa0a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1e22;--ink:#f1f0e8;--mute:#9aa0a8;--line:#f1f0e8;--blue:#5b9bff;--card:#262a30;--car:#5a606a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.4 "Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:20px 16px 40px}
h1{font-size:34px;line-height:1.05;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 18px}
#bays{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
.bay{aspect-ratio:1/1.6;border:3px solid var(--line);border-top:0;border-radius:0 0 4px 4px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:6px 0;font-weight:700;font-size:22px;position:relative}
.bay small{font-size:13px;font-weight:500;color:var(--mute)}
.bay.reserved{background:var(--blue);border-color:var(--blue);color:#fff}
.bay.reserved small{color:#dbe7ff}
.bay.occupied::before{content:"";position:absolute;inset:18% 22% 38%;background:var(--car);border-radius:8px 8px 4px 4px}
.bay.mine{outline:3px solid var(--blue);outline-offset:3px}
label{display:block;font-size:15px;color:var(--mute);margin:12px 0 4px}
input{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:16px}
button{flex:1;font:700 18px "Barlow Semi Condensed",Arial,sans-serif;padding:13px 8px;border-radius:6px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.main{background:var(--blue);border-color:var(--blue);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#msg{margin-top:18px;padding:12px 14px;border-left:6px solid var(--blue);background:var(--card);min-height:48px}
#msg.bad{border-color:#d33}
#link{font-size:15px;color:var(--mute);margin-top:6px}
</style>
</head>
<body>
<main>
  <h1>Reserve a bay</h1>
  <p class="sub" id="link">Not connected</p>

  <div id="bays" aria-label="Parking bays"></div>

  <label for="topic">Lot topic (same as BASE_TOPIC in main.py)</label>
  <input id="topic" value="iot_parking_CHANGE_ME/lot1" autocomplete="off">
  <label for="name">Your name (max 12 letters, no spaces needed)</label>
  <input id="name" maxlength="12" placeholder="e.g. arun" autocomplete="off">

  <div class="row"><button class="main" id="bReserve" disabled>Reserve a bay</button></div>
  <div class="row">
    <button id="bArrive" disabled>I’ve arrived</button>
    <button id="bCancel" disabled>Cancel booking</button>
  </div>
  <div id="msg">Enter the lot topic and your name, then reserve.</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const BROKER = "wss://broker.hivemq.com:8884/mqtt";
let client = null, topic = "", mySlot = null;

try { $("topic").value = localStorage.getItem("pk_topic") || $("topic").value;
      $("name").value = localStorage.getItem("pk_name") || ""; } catch (e) {}

function say(text, bad) { $("msg").textContent = text; $("msg").className = bad ? "bad" : ""; }
function setButtons(on) { ["bReserve","bArrive","bCancel"].forEach(b => $(b).disabled = !on); }

function drawBays(states) {
  $("bays").innerHTML = states.map((s, i) =>
    `<div class="bay ${s}${mySlot === i + 1 ? " mine" : ""}"><small>${s}</small>${i + 1}</div>`).join("");
}
drawBays(["free","free","free","free","free"]);

function connect() {
  topic = $("topic").value.trim().replace(/\/+$/, "");
  if (client) client.end(true);
  $("link").textContent = "Connecting…";
  client = mqtt.connect(BROKER, { clientId: "phone-" + Math.random().toString(16).slice(2, 8) });
  client.on("connect", () => {
    client.subscribe([topic + "/slots", topic + "/reply", topic + "/status"]);
    $("link").textContent = "Connected to " + topic;
    setButtons(true);
  });
  client.on("close", () => { $("link").textContent = "Disconnected, retrying…"; setButtons(false); });
  client.on("message", (t, buf) => {
    const text = buf.toString();
    if (t.endsWith("/status")) { if (text === "offline") say("The parking lot is offline.", true); return; }
    let d; try { d = JSON.parse(text); } catch (e) { return; }
    if (t.endsWith("/slots")) { drawBays(d.slots); return; }
    if (d.name !== myName()) return;
    if (!d.ok) { mySlot = null; say("Could not complete: " + d.reason + ".", true); return; }
    if (d.slot) mySlot = d.slot;
    if (d.note === "cancelled") { mySlot = null; say("Booking cancelled."); }
    else if (d.note === "drive to the gate") say("Checked in. Drive to the gate and you will be sent to bay " + d.slot + ".");
    else say("Bay " + d.slot + " is yours" + (d.hold_s ? " for " + d.hold_s / 60 + " minutes. Tap “I’ve arrived” when you are close." : "."));
    drawBays([...document.querySelectorAll(".bay")].map(b => b.classList.contains("occupied") ? "occupied" : b.classList.contains("reserved") ? "reserved" : "free"));
  });
}

function myName() { return $("name").value.trim().slice(0, 12); }
function send(action) {
  const name = myName();
  if (!name) { say("Enter your name first.", true); return; }
  try { localStorage.setItem("pk_name", name); localStorage.setItem("pk_topic", topic); } catch (e) {}
  client.publish(topic + "/reserve", JSON.stringify({ action, name }));
  say("Sent. Waiting for the parking lot…");
}

$("bReserve").onclick = () => send("reserve");
$("bArrive").onclick = () => send("arrive");
$("bCancel").onclick = () => send("cancel");
$("topic").addEventListener("change", connect);
connect();
</script>
</body>
</html>
